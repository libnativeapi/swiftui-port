<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwiftUIPort</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { margin: 0; }
    #swiftui-root { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
    #startup-status { padding: 12px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@bjorn3/browser_wasi_shim": "./app/node_modules/@bjorn3/browser_wasi_shim/dist/index.js"
      }
    }
  </script>
</head>
<body>
  <main id="swiftui-root"><div id="startup-status" role="status">Loading…</div></main>
  <script type="module">
    const status = document.getElementById("startup-status");
    try {
      const { init } = await import("./app/index.js");
      await init();
      status.remove();
    } catch (error) {
      status.textContent = "Could not start the Swift app.";
      console.error(error);
    }
  </script>
</body>
</html>
