name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The nativeapi Swift binding needs the platform support proposed in
# libnativeapi/nativeapi#33. Point NATIVEAPI_REF at main once that PR merges.
env:
  NATIVEAPI_REPOSITORY: libnativeapi/nativeapi
  NATIVEAPI_REF: swift-desktop-platforms

jobs:
  runtime-macos:
    name: runtime (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swiftui-port
    steps:
      - uses: actions/checkout@v4
        with:
          path: swiftui-port

      - name: Show Swift version
        run: swift --version

      - name: Build SwiftUIRuntime
        run: swift build

      - name: Test SwiftUIRuntime
        run: swift test

  linux:
    name: build and smoke (Linux, GTK 3)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 30
    defaults:
      run:
        working-directory: swiftui-port
    steps:
      - uses: actions/checkout@v4
        with:
          path: swiftui-port

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NATIVEAPI_REPOSITORY }}
          ref: ${{ env.NATIVEAPI_REF }}
          path: nativeapi

      - name: Initialise the nativeapi core submodule
        working-directory: nativeapi
        run: git submodule update --init core

      - name: Install GTK, X11 and Xvfb
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libx11-dev libxi-dev xvfb dbus \
            openbox scrot

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Smoke test under Xvfb
        run: |
          dbus-run-session -- \
            xvfb-run -a -s "-screen 0 1024x768x24" \
            .build/debug/Counter --smoke

      - name: Capture a Linux screenshot
        run: |
          mkdir -p artifacts
          dbus-run-session -- xvfb-run -a -s "-screen 0 1024x768x24" bash -euo pipefail -c '
            openbox >/tmp/openbox.log 2>&1 &
            sleep 1
            .build/debug/Counter --smoke &
            app=$!
            sleep 1
            scrot -o /tmp/counter-linux.png
            wait "$app"
          '
          cp /tmp/counter-linux.png artifacts/counter-linux.png

      - uses: actions/upload-artifact@v4
        with:
          name: counter-linux-screenshot
          path: swiftui-port/artifacts/counter-linux.png
          retention-days: 7
          if-no-files-found: error

  windows:
    name: build and smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: swiftui-port
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: swiftui-port

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NATIVEAPI_REPOSITORY }}
          ref: ${{ env.NATIVEAPI_REF }}
          path: nativeapi

      - name: Initialise the nativeapi core submodule
        working-directory: nativeapi
        run: git submodule update --init core

      # The Swift binding reaches the core through a symlink. Git on Windows
      # cannot always create it; turn a checked-out link file into a junction.
      - name: Ensure the nativeapi core link is a directory
        run: |
          $link = "..\nativeapi\bindings\swift\Sources\CNativeAPI\core"
          if (Test-Path $link -PathType Leaf) {
            Write-Host "Core link was checked out as a file; creating a junction."
            Remove-Item $link -Force
            $target = (Resolve-Path "..\nativeapi\core").Path
            cmd /c mklink /J "$link" "$target"
          }
          Get-Item $link | Format-List FullName,Attributes,LinkType,Target

      # The runner's MSVC 14.51 STL requires Clang 20 or newer, which Swift
      # 6.0's Clang 17 cannot satisfy. Swift 6.2 is still language mode 5 for
      # this package; update-sdk-modules keeps the SDK maps compatible.
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
          update-sdk-modules: true

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Smoke test
        run: .\.build\debug\Counter.exe --smoke
